<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
             border: 1px solid;
             border: 1px solid rgb(28, 112, 133);
          }
           table {
            border-collapse: collapse;
           }
           
           th, td{
            padding: 5px
           }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">
      
        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                    <th>Tastyness</th>
                </tr>
        </thead>        
        <tbody>
            <tr>
                <td>Spaghetti</td>
                <td>Pasta and Tomato sauce</td>
                <td>$12.99</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Mac n cheese</td>
                <td>Elbow pasta, Cheese, milk, and butter</td>
                <td>$10.50</td>
                <td>1000</td>
            </tr>    
        </tbody>   
                
           
        </table>


    </body>
</html>
